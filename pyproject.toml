[project]
name = "aenf"
version = "0.1.0"
description = "Real-time heads-up display overlay for debate flaw detection and instant counter-arguments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sounddevice>=0.5.0",
    "numpy>=2.0.0",
    "faster-whisper>=1.0.0",
    "requests>=2.31.0",
    "PyQt6>=6.6.0",
]

[project.scripts]
aenf = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
