[project]
name = "elenchus"
version = "1.0.0"
description = "Elenchus (ἔλεγχος): Socratic debate analysis and fallacy detection engine for live interactions and recorded speech."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sounddevice>=0.5.0",
    "numpy>=2.0.0",
    "faster-whisper>=1.0.0",
    "PyQt6>=6.6.0",
]

[project.scripts]
elenchus = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]
only-include = ["core", "ui", "config.py", "main.py"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
