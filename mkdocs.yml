site_name: Elenchus Documentation
site_description: "Socratic debate analysis and fallacy detection engine. System architecture, installation, and technical specifications."
site_url: "https://asifdotexe.github.io/Elenchus/docs/"
repo_name: "Asifdotexe/Elenchus"
repo_url: "https://github.com/Asifdotexe/Elenchus"
docs_dir: "docs"
site_dir: "site/docs"

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: lime
  features:
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra:
  homepage: "https://asifdotexe.github.io/Elenchus/"
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/Asifdotexe/Elenchus"
      name: GitHub Repository

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - "Overview": index.md
  - "Philosophy": philosophy.md
  - "Installation": installation.md
  - "Architecture": architecture.md
  - "Specifications": specifications.md
  - "User Guide": user-guide.md
  - "Blueprint": blueprint.md
