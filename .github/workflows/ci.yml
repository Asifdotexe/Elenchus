name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ "3.12" ]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libasound2-dev \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Run Ruff linter and formatter checks
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run unit tests
        run: uv run python -m unittest tests/test_core.py

      - name: Verify CLI list-devices
        run: uv run aenf --list-devices

      - name: Verify Headless HUD initialization
        run: |
          uv run python -c "from PyQt6.QtWidgets import QApplication; from config import Config; from core.pipeline import PipelineWorker; from ui.overlay import AenfOverlay; app = QApplication([]); cfg = Config(); p = PipelineWorker(cfg); o = AenfOverlay(cfg, p); o.show(); o.close()"
